spring.datasource.url=jdbc:h2:file:./data/dingtalk-approval;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# 在钉钉开发者后台把事件订阅切换为 Stream 模式并添加审批实例事件后改为 true。
dingtalk.stream.enabled=${DINGTALK_STREAM_ENABLED:false}
