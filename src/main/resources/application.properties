spring.application.name=dingtalk-approval

dingtalk.client-id=${DINGTALK_CLIENT_ID}
dingtalk.client-secret=${DINGTALK_CLIENT_SECRET}
dingtalk.process-code=PROC-97A5C485-D9B4-4470-85F2-BB98A6DF8AB7
dingtalk.redirect-uri=http://localhost:8080/api/dingtalk/login/callback
# 统计页仅限 BU Head。正式部署时优先通过环境变量配置 Vincent 的准确钉钉 userId。
dingtalk.manager-user-ids=${DINGTALK_MANAGER_USER_IDS:}
dingtalk.manager-names=${DINGTALK_MANAGER_NAMES:Vincent Wang}
# 开发期间允许 Jack 查看统计；上线交接后可通过环境变量清空或替换。
dingtalk.developer-user-ids=${DINGTALK_DEVELOPER_USER_IDS:235638251739-1704317153}
# 部门层级权限：留空表示经理可查看全部部门；填写后经理只能查看这些部门（逗号分隔的部门 ID）。
# 例如 dingtalk.manager-dept-ids=123,456 表示经理只负责这两个部门，实现“分层级访问控制”。
dingtalk.manager-dept-ids=${DINGTALK_MANAGER_DEPT_IDS:}
# 主管（MANAGER）在审批概览中的数据范围：
#   INVOLVED   = 只看与自己相关（自己发起或参与审批）的单据（默认，权限最小）
#   DEPARTMENT = 只看 dingtalk.manager-dept-ids 指定部门
#   ALL        = 查看全部审批单，对应“主管可以处理所有审批单”
# 留空时自动推断：配置了 manager-dept-ids 则为 DEPARTMENT，否则为 INVOLVED。
dingtalk.manager-scope=${DINGTALK_MANAGER_SCOPE:}
# 可选审批人白名单：留空表示任何用户都能查看“我的待办”（钉钉本身只会把属于他的任务返回给他）。
# 填写后只有名单内的用户可以进入待办页处理审批，用于限制测试范围。
dingtalk.approver-user-ids=${DINGTALK_APPROVER_USER_IDS:}

spring.datasource.url=jdbc:h2:file:./data/dingtalk-approval;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# 在钉钉开发者后台把事件订阅切换为 Stream 模式并添加审批实例事件后改为 true。
dingtalk.stream.enabled=${DINGTALK_STREAM_ENABLED:false}

# ---------------------------------------------------------------------------
# 审批结果通知（钉钉消息推送）
# 测试版默认关闭，避免向同事推送真实钉钉消息；联调时把 DINGTALK_NOTIFY_ENABLED 设为 true。
# ---------------------------------------------------------------------------
dingtalk.notify.enabled=${DINGTALK_NOTIFY_ENABLED:false}
# 通知通道：ROBOT = 机器人单聊消息（robotCode 取 client-id，无需额外配置）；
#           WORK_NOTICE = 企业工作通知（需要同时配置 dingtalk.agent-id）。
dingtalk.notify.channel=${DINGTALK_NOTIFY_CHANNEL:ROBOT}
# 工作通知所需的微应用 AgentId，仅 WORK_NOTICE 通道需要。
dingtalk.agent-id=${DINGTALK_AGENT_ID:}

# ---------------------------------------------------------------------------
# 审批状态定时同步
# 定时轮询钉钉，把“审批中”的单据刷新为最终结果，并在状态变化时推送通知，
# 作为 Stream 事件推送的兜底方案（Stream 未开启时也能保证数据最终一致）。
# ---------------------------------------------------------------------------
dingtalk.sync.enabled=${DINGTALK_SYNC_ENABLED:true}
dingtalk.sync.interval-ms=${DINGTALK_SYNC_INTERVAL_MS:300000}
# 首次同步延迟，避免应用启动阶段就发起大量钉钉请求。
dingtalk.sync.initial-delay-ms=${DINGTALK_SYNC_INITIAL_DELAY_MS:30000}
# 单次同步处理的单据上限，防止一次性拉取过多钉钉接口。
dingtalk.sync.batch-size=${DINGTALK_SYNC_BATCH_SIZE:20}
