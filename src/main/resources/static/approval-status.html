<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>审批管理中心</title><link rel="stylesheet" href="/approval-ui.css"></head><body><div class="shell">
<header class="topbar"><a class="brand" href="/"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M7 12.5l3.1 3.1L17.5 8" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>EWE 审批中心<small>MANAGEMENT CONSOLE</small></span></a><nav class="nav"><a href="/" data-short="首页">首页</a><a class="active manager-only" href="/approval-status.html" data-short="概览">审批概览</a><a href="/approval-test.html" data-short="发起">发起审批</a></nav></header>
<main class="container"><div class="page-head"><div><p class="eyebrow">Approval Overview</p><h1>审批管理概览</h1><p>集中查看审批进度与最终结果，关键状态一目了然。</p></div><div class="live-pill"><span class="live-dot"></span>钉钉事件服务已接入</div></div>
<div id="loginPrompt" class="login-prompt hidden"><div><strong>请先登录钉钉</strong><span>登录后即可查看与你相关的审批记录。</span></div><a class="btn btn-primary" href="/api/dingtalk/login">扫码登录</a></div><section class="kpis" id="stats"></section>
<section class="panel"><div class="toolbar"><form id="import" class="toolbar-group"><input class="input" id="instanceId" placeholder="输入审批实例 ID 进行导入" required><button class="btn btn-primary">导入并查询</button></form><div class="toolbar-group"><button class="btn" id="reload" type="button">刷新数据</button><button class="btn" id="syncAll" type="button">同步审批中单据</button></div></div>
<div class="table-wrap"><table class="data-table"><thead><tr><th>审批事项</th><th>当前状态</th><th>钉钉结果</th><th>创建时间</th><th>完成时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section><div id="message" class="notice" role="status" aria-live="polite"></div>
</main></div><script>
let csrf=''; let current=[]; const message=document.querySelector('#message');
const labels={APPROVED:'已通过',REJECTED:'已拒绝',RUNNING:'审批中',TERMINATED:'已撤销/终止'};
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf,...options.headers}});const d=await r.json();if(!r.ok||d.success===false)throw new Error(d.message||'请求失败');return d}
async function init(){try{const session=await api('/api/dingtalk/session');if(!session.canViewStatistics)throw new Error('审批统计仅限 BU Head Vincent Wang 访问。');document.querySelectorAll('.manager-only').forEach(e=>e.classList.add('allowed'));csrf=(await api('/api/dingtalk/approval/options')).csrfToken;await load()}catch(e){document.querySelector('#loginPrompt').classList.remove('hidden');document.querySelector('#loginPrompt strong').textContent='无法访问审批统计';document.querySelector('#loginPrompt span').textContent=e.message;setMessage(e.message,'error')}}
async function load(){const d=await api('/api/dingtalk/approvals');current=d.approvals;const s=d.statistics;document.querySelector('#stats').innerHTML=`<article class="kpi"><div class="kpi-label">审批总数</div><div class="kpi-value">${s.total}</div><div class="kpi-bar"></div></article><article class="kpi approved"><div class="kpi-label">已通过</div><div class="kpi-value">${s.approved}</div><div class="kpi-bar"></div></article><article class="kpi rejected"><div class="kpi-label">已拒绝</div><div class="kpi-value">${s.rejected}</div><div class="kpi-bar"></div></article><article class="kpi running"><div class="kpi-label">审批中</div><div class="kpi-value">${s.running}</div><div class="kpi-bar"></div></article><article class="kpi"><div class="kpi-label">已撤销</div><div class="kpi-value">${s.terminated}</div><div class="kpi-bar"></div></article>`;document.querySelector('#rows').innerHTML=current.length?current.map(x=>`<tr><td class="title-cell">${esc(x.title||x.businessId||'未命名审批')}<small>${esc(x.businessId||x.instanceId)}</small></td><td><span class="badge ${x.status}">${labels[x.status]||x.status}</span></td><td>${esc(x.result||'-')}</td><td class="muted">${date(x.createdAt)}</td><td class="muted">${date(x.finishedAt)}</td><td><button class="link-btn" data-sync="${esc(x.instanceId)}">立即同步</button></td></tr>`).join(''):'<tr><td class="empty" colspan="6">暂无审批记录</td></tr>';setMessage('')}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))} function date(v){return v?new Date(v).toLocaleString():'-'}
async function sync(id){await api('/api/dingtalk/approvals/'+encodeURIComponent(id)+'/sync',{method:'POST'});await load()}
function setMessage(text,type=''){message.textContent=text;message.className='notice '+type}
document.querySelector('#reload').onclick=()=>{setMessage('正在刷新数据…');load().catch(e=>setMessage(e.message,'error'))};
document.querySelector('#rows').onclick=e=>{if(e.target.dataset.sync){setMessage('正在同步审批状态…');sync(e.target.dataset.sync).then(()=>setMessage('状态同步完成','success')).catch(x=>setMessage(x.message,'error'))}};
document.querySelector('#syncAll').onclick=async()=>{setMessage('正在同步所有审批中单据…');try{for(const x of current.filter(x=>x.status==='RUNNING'))await sync(x.instanceId);setMessage('全部状态同步完成','success')}catch(e){setMessage(e.message,'error')}};
document.querySelector('#import').onsubmit=async e=>{e.preventDefault();try{setMessage('正在导入审批实例…');await api('/api/dingtalk/approvals/import',{method:'POST',body:JSON.stringify({instanceId:document.querySelector('#instanceId').value.trim()})});await load();setMessage('审批实例导入成功','success')}catch(x){setMessage(x.message,'error')}};
init();
</script></body></html>
