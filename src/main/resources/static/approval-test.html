<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>发起审批</title><link rel="stylesheet" href="/approval-ui.css">
</head>
<body><div class="shell"><header class="topbar"><a class="brand" href="/"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M7 12.5l3.1 3.1L17.5 8" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>EWE 审批中心<small>MANAGEMENT CONSOLE</small></span></a><div class="top-actions"><nav class="nav"><a href="/" data-short="首页">首页</a><a href="/approval-status.html" data-short="概览" class="manager-only">审批概览</a><a class="active" href="/approval-test.html" data-short="发起">发起审批</a></nav><div id="userProfile" class="user-profile"></div></div></header>
<main class="container"><div class="page-head"><div><p class="eyebrow">New Request</p><h1>发起审批申请</h1><p>确认发起人及所属部门后，将申请提交至钉钉审批流程。</p></div></div>
<div class="form-layout"><section class="panel form-card"><div class="steps"><div class="step active">身份确认</div><div class="step active">选择审批</div><div class="step">钉钉审批</div></div><h2 class="section-title">选择审批类型</h2><p class="section-desc">以下内容来自钉钉为当前用户配置的审批可见范围。选择后在钉钉中填写并提交申请。</p>
<div id="identity" class="identity"><div class="avatar">钉</div><div><strong>正在确认登录身份</strong><span>请稍候…</span></div></div>
<div id="form"><div class="field"><label for="department">本次发起部门</label><select class="select" id="department" disabled><option value="">请先加载部门</option></select><p class="field-help">如果你属于多个部门，请先选择本次申请归属的部门。</p></div><div class="field"><label>你可以发起的审批</label><div id="templates" class="template-grid"><div class="template-empty">正在加载可见审批类型…</div></div><p class="field-help">点击审批类型即可唤起钉钉客户端填写并提交。</p></div><div class="submit-row"><button class="btn" id="refresh" type="button">刷新身份与部门</button><a class="link-btn" href="/api/dingtalk/login" target="_blank" rel="noopener">重新扫码登录</a></div></div><div id="result" class="result-box" role="status" aria-live="polite"></div></section>
</div>
</main></div>
<script src="/approval-profile.js"></script><script>
const department = document.querySelector('#department');
const refresh = document.querySelector('#refresh');
const result = document.querySelector('#result');
async function api(url, options) {
  const response = await fetch(url, {credentials: 'same-origin', ...options});
  const data = await response.json();
  if (!response.ok || data.success === false) throw new Error(data.message || '请求失败，请刷新页面后重试。');
  return data;
}
async function loadDepartments() {
  refresh.disabled = true;
  department.disabled = true;
  department.replaceChildren(new Option('正在加载部门', ''));
  document.querySelector('#identity').innerHTML = '<div class="avatar">钉</div><div><strong>正在确认登录身份</strong><span>正在查询所属部门…</span></div>';
  result.textContent = '正在查询所属部门…';
  try {
    const data = await api('/api/dingtalk/approval/options');
    renderUserProfile(data);
    document.querySelector('#identity').innerHTML = '<div class="avatar">钉</div><div><strong>钉钉身份已确认</strong><span>用户 ID：' + esc(data.userId) + '</span></div>';
    renderTemplates(data.templates || []);
    if(data.canViewStatistics) document.querySelectorAll('.manager-only').forEach(e=>e.classList.add('allowed'));
    department.replaceChildren();
    if (!data.departments.length) {
      department.add(new Option('未查到所属部门', ''));
      result.textContent = '未查到所属部门，无法发起审批。';
      return;
    }
    if (data.departments.length > 1) department.add(new Option('请选择本次发起部门', ''));
    for (const item of data.departments) department.add(new Option(item.name + '（' + item.deptId + '）', item.deptId));
    department.disabled = data.departments.length === 1;
    result.textContent = data.departments.length === 1 ? '已自动选择唯一所属部门。' : '你属于多个部门，请选择本次发起部门。';
  } catch (error) {
    document.querySelector('#identity').innerHTML = '<div class="avatar">!</div><div><strong>需要登录钉钉</strong><span>完成登录后会自动返回本页面。</span></div>';
    result.innerHTML = esc(error.message) + '<br><a class="btn btn-primary" href="/api/dingtalk/login">钉钉扫码登录</a>';
    result.className='result-box error';
  }
  finally { refresh.disabled = false; }
}
function safeUrl(value){return /^(https:\/\/|dingtalk:\/\/)/i.test(value||'')?value:''}
function dingtalkClientUrl(value){
  const url=safeUrl(value);
  if(!url)return '';
  if(url.startsWith('dingtalk://'))return url;
  return 'dingtalk://dingtalkclient/page/link?url='+encodeURIComponent(url)+'&pc_slide=false';
}
function renderTemplates(templates){
  const root=document.querySelector('#templates'); root.replaceChildren();
  const available=templates.filter(item=>!item.apiIntegrated);
  if(!available.length){root.innerHTML='<div class="template-empty">当前账号没有可发起的审批，请联系钉钉管理员检查审批模板可见范围。</div>';return}
  for(const item of available){
    const card=document.createElement('a'); card.className='template-card';
    const url=dingtalkClientUrl(item.url);if(url){card.href=url;card.title='在钉钉中打开“'+item.name+'”'}else{card.setAttribute('aria-disabled','true')}
    const icon=document.createElement('span');icon.className='template-icon';icon.textContent=(item.name||'审批').slice(0,1);
    if(safeUrl(item.iconUrl)){const image=document.createElement('img');image.src=item.iconUrl;image.alt='';icon.replaceChildren(image)}
    const copy=document.createElement('span');const name=document.createElement('strong');name.textContent=item.name;const hint=document.createElement('small');hint.textContent='点击唤起钉钉填写';copy.append(name,hint);card.append(icon,copy);root.append(card);
  }
}
refresh.addEventListener('click', loadDepartments);
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
loadDepartments();
</script></body></html>
